<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GK Cabinet Wireframe</title>
  <style>
    :root { color-scheme: dark; --ink: #eaf9ff; --muted: #88a0b6; --panel: #0a101a; --line: #26384c; --accent: #00ddff; }
    * { box-sizing: border-box; } body { min-width: 320px; margin: 0; background: #05080d; color: var(--ink); font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .app { width: min(1200px, 100%); min-height: 100vh; margin: 0 auto; display: grid; grid-template-columns: 300px minmax(540px, 1fr); } .controls { height: 100vh; padding: 24px 18px; overflow-y: auto; border-right: 1px solid var(--line); background: #05080d; display: grid; align-content: start; gap: 14px; } .preview { min-width: 0; padding: 24px; display: grid; align-content: start; justify-items: center; gap: 12px; }
    h1 { margin: 0; font-size: 18px; } p { margin: 3px 0 0; color: var(--muted); font-size: 11px; } fieldset { margin: 0; padding: 0; border: 0; display: grid; gap: 5px; } label { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; } output { color: var(--ink); }
    input, select { width: 100%; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); color: var(--ink); font: inherit; } input[type="range"] { padding: 0; accent-color: var(--accent); } input[type="color"] { height: 34px; padding: 2px; } input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); } input:focus, select:focus { outline: 1px solid var(--accent); outline-offset: 1px; }
    button { min-height: 32px; border: 1px solid #3d5974; border-radius: 3px; background: #102031; color: var(--ink); cursor: pointer; font: inherit; } button:hover { border-color: var(--accent); background: #17304a; } .toggle { display: flex; align-items: center; justify-content: space-between; min-height: 32px; padding: 0 8px; border: 1px solid var(--line); background: var(--panel); }
    .group { display: grid; gap: 9px; padding-top: 12px; border-top: 1px solid var(--line); } .group h2 { margin: 0; color: var(--ink); font-size: 11px; letter-spacing: .04em; }.preview-header { width: 540px; display: flex; justify-content: space-between; color: var(--muted); }.preview-header strong { color: var(--ink); font-size: 15px; } #cabinet { width: 540px; height: 675px; display: block; border: 1px solid #344a61; background: #050914; box-shadow: 0 18px 50px #000a; image-rendering: pixelated; } .status { width: 540px; min-height: 18px; color: var(--muted); font-size: 12px; }
    @media (max-width: 900px) { .app { padding: 16px; grid-template-columns: 1fr; gap: 20px; }.controls { height: auto; padding: 0 0 20px; overflow: visible; border-right: 0; border-bottom: 1px solid var(--line); }.preview { padding: 0; } } @media (max-width: 600px) { .app { padding: 12px; }.preview-header, #cabinet, .status { width: min(540px, calc(100vw - 24px)); } #cabinet { height: auto; aspect-ratio: 4 / 5; } }
  </style>
</head>
<body>
  <main class="app">
    <aside class="controls" aria-label="Cabinet wireframe controls">
      <div><h1>GK Wireframe Models</h1><p>LOW-RES 3D ASSET STUDY</p></div>
      <section class="group" aria-labelledby="modelHeading"><h2 id="modelHeading">MODEL</h2><fieldset><label for="model">ASSET</label><select id="model"><option value="asteroids">ASTEROIDS UPRIGHT</option><option value="ironman">IRON MAN PINBALL</option><option value="neogeo">NEO GEO ARCADE CABINET</option><option value="pacman">PAC-MAN ARCADE CABINET</option></select></fieldset></section>
      <section class="group" aria-labelledby="motionHeading"><h2 id="motionHeading">MOTION</h2><fieldset><label for="rotationSpeed">ROTATION SPEED <output id="rotationSpeedOutput"></output></label><input id="rotationSpeed" type="range" min="0" max="120" value="30"></fieldset><fieldset><label for="yaw">MODEL YAW <output id="yawOutput"></output></label><input id="yaw" type="range" min="-180" max="180" value="-35"></fieldset><fieldset><label for="pitch">MODEL PITCH <output id="pitchOutput"></output></label><input id="pitch" type="range" min="-20" max="20" value="0"></fieldset><label class="toggle" for="autoRotate">AUTO ROTATE <input id="autoRotate" type="checkbox" checked></label><label class="toggle" for="flyby">FLYBY CAM <input id="flyby" type="checkbox"></label></section>
      <section class="group" aria-labelledby="viewHeading"><h2 id="viewHeading">VIEW</h2><fieldset><label for="zoom">CAMERA ZOOM <output id="zoomOutput"></output></label><input id="zoom" type="range" min="45" max="450" value="100"></fieldset><fieldset><label for="cameraPitch">CAMERA PITCH <output id="cameraPitchOutput"></output></label><input id="cameraPitch" type="range" min="-55" max="55" value="0"></fieldset><fieldset><label for="cameraOrbit">CAMERA ORBIT <output id="cameraOrbitOutput"></output></label><input id="cameraOrbit" type="range" min="-180" max="180" value="0"></fieldset></section>
      <section class="group" aria-labelledby="lookHeading"><h2 id="lookHeading">LOOK</h2><fieldset><label for="opacity">LINE OPACITY <output id="opacityOutput"></output></label><input id="opacity" type="range" min="10" max="100" value="72"></fieldset><fieldset><label for="lineColor">LINE COLOR</label><input id="lineColor" type="color" value="#00ddff"></fieldset></section>
      <button id="reset" type="button">RESET VIEW</button>
    </aside>
    <section class="preview" aria-label="Cabinet wireframe preview"><div class="preview-header"><strong>LIVE MODEL</strong><span>1080 x 1350 / 4:5</span></div><canvas id="cabinet" width="540" height="675" aria-label="Rotating arcade cabinet wireframe"></canvas><output id="status" class="status" aria-live="polite">Loading cabinet model...</output></section>
  </main>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js" } }
  </script>
  <script type="module" src="./sequence/cabinet.js?v=27"></script>
</body>
</html>
