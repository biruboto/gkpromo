<!doctype html>
<html lang="en">
<head>

    #screen { position: relative; width: min(100vw, calc(100vh * 1.428571)); aspect-ratio: 320 / 224; overflow: hidden; }
    #scene, #hud { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }

    #hud { pointer-events: none; }
    #dev { position: fixed; z-index: 4; top: 12px; right: 12px; width: 260px; padding: 12px; color: var(--text); background: var(--space); border: 1px solid var(--wire); font: 12px/1.4 monospace; box-shadow: 0 0 0 2px var(--shadow); }
    #dev[hidden] { display: none; }
    #dev h2 { margin: 0 0 10px; color: var(--accent); font-size: 13px; letter-spacing: 0; }
    #dev label { display: block; margin-top: 9px; color: var(--wire); }
    #dev select, #dev input { width: 100%; margin-top: 3px; padding: 5px; color: var(--text); border: 1px solid var(--grid); background: var(--shadow); font: inherit; }
    .color-field { display: flex; align-items: stretch; gap: 6px; margin-top: 3px; }
    .color-field select { flex: 1; width: auto !important; margin-top: 0 !important; }
    #color-preview { width: 30px; flex: 0 0 30px; border: 1px solid var(--text); background: var(--space); }
    #palette-randomize, #boot-replay { width: 100%; margin-top: 12px; padding: 7px; color: var(--space); border: 1px solid var(--accent); background: var(--accent); font: inherit; font-weight: bold; cursor: pointer; }
    #boot-replay { margin-top: 8px; color: var(--text); border-color: var(--grid); background: var(--shadow); }
    #palette-randomize:hover, #boot-replay:hover { color: var(--text); background: var(--wire); border-color: var(--wire); }
    #atascii-sheet { display: block; width: 100%; height: auto; margin-top: 4px; border: 1px solid var(--grid); background: var(--shadow); image-rendering: pixelated; }
    #atascii-selected { display: block; margin-top: 4px; color: var(--accent); font-size: 10px; }
    #dev p { margin: 11px 0 0; color: var(--teal); font-size: 10px; }
  </style>
</head>

    function defaultAssignments(name, colors) {

      rootStyle.setProperty('--wire', colorCss('wireframe')); rootStyle.setProperty('--accent', colorCss('hudStatus'));
