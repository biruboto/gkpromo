<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GK Promo Composer</title>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js" } }
  </script>
  <style>
    :root { color-scheme: dark; --ink: #eaf9ff; --muted: #88a0b6; --panel: #0a101a; --line: #26384c; --accent: #00ddff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: #05080d; color: var(--ink); font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .app { width: min(1600px, 100%); min-height: 100vh; margin: 0 auto; display: grid; grid-template-columns: 290px minmax(540px, 1fr) 400px; align-items: start; }
    .preview { min-width: 0; min-height: 100vh; padding: 24px; display: grid; align-content: start; justify-items: center; gap: 12px; overflow-x: auto; }
    .preview-header { width: min(540px, 100%); display: flex; align-items: baseline; justify-content: space-between; color: var(--muted); }
    .preview-header strong { color: var(--ink); font-size: 15px; }
    #preview { width: min(540px, 100%); height: auto; display: block; flex: none; image-rendering: pixelated; background: #020208; border: 1px solid #344a61; box-shadow: 0 18px 50px #000a; }
    .preview[data-output-format="landscape"] .preview-header, .preview[data-output-format="landscape"] #preview { width: min(720px, 100%); }
    .status { min-height: 18px; color: var(--muted); font-size: 12px; }
    .status-warning { color: #ffdf4d; }
    .build-version { color: var(--muted); font-size: 9px; }
    .dock { min-width: 0; height: 100vh; padding: 24px 18px; overflow-y: auto; display: grid; align-content: start; gap: 6px; background: #05080d; }
    .left-dock { border-right: 1px solid var(--line); }
    .right-dock { border-left: 1px solid var(--line); }
    h1 { margin: 0; line-height: 0; } .composer-title { display: block; max-width: 100%; height: 32px; image-rendering: pixelated; } .eyebrow { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    fieldset { margin: 0; padding: 0; border: 0; display: grid; gap: 5px; } label, legend { padding: 0; color: var(--muted); font-size: 10px; }
    input, textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 3px; padding: 7px 8px; background: var(--panel); color: var(--ink); font: inherit; }
    input[type="range"] { padding: 0; accent-color: var(--accent); }
    textarea { min-height: 68px; resize: vertical; } input:focus, textarea:focus, select:focus { outline: 1px solid var(--accent); outline-offset: 1px; }
    .two-up, .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; } .actions { gap: 6px; }
    .range-label { display: flex; justify-content: space-between; } .range-label output { color: var(--ink); }
    .field-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; } .field-heading > input { min-width: 0; } .field-heading button { min-height: 22px; padding: 2px 7px; font-size: 10px; }
    .control-section { position: relative; border-top: 1px solid var(--line); }
    .control-section summary { min-height: 31px; display: flex; align-items: center; gap: 8px; color: var(--ink); cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: .04em; list-style: none; }
    .control-section summary::-webkit-details-marker { display: none; }
    .control-section summary::after { content: '+'; margin-left: auto; color: var(--muted); font-size: 17px; font-weight: 400; }
    .control-section[open] summary { color: var(--accent); }
    .control-section[open] summary::after { content: '-'; color: var(--accent); }
    .control-section summary:focus-visible { outline: 1px solid var(--accent); outline-offset: -3px; }
    .sortable-section summary { cursor: grab; }
    .sortable-section summary[draggable="false"] { cursor: default; }
    .sortable-section summary:active { cursor: grabbing; }
    .section-grip { width: 16px; height: 20px; flex: 0 0 16px; display: grid; place-items: center; color: var(--muted); }
    .section-grip svg { width: 14px; height: 14px; }
    .sortable-section[open] .section-grip { color: var(--accent); }
    .sortable-section.is-dragging { opacity: .4; }
    .sortable-section.drop-before::before, .sortable-section.drop-after::after { content: ''; position: absolute; z-index: 2; left: 0; right: 0; height: 2px; pointer-events: none; background: var(--accent); box-shadow: 0 0 8px #00ddffaa; }
    .sortable-section.drop-before::before { top: -1px; }
    .sortable-section.drop-after::after { bottom: -1px; }
    .section-body { padding: 0 0 9px; display: grid; gap: 8px; }
    .text-section { gap: 6px; }
    .footer-group { display: grid; gap: 6px; padding-top: 8px; border-top: 1px solid var(--line); }
    .footer-group:first-child { padding-top: 0; border-top: 0; }
    .footer-group-heading { margin: 0; color: var(--accent); font-size: 10px; font-weight: 700; letter-spacing: .04em; }
    .text-toolbar { display: grid; gap: 6px; }
    .font-scale-row { display: grid; grid-template-columns: minmax(116px, 150px) minmax(0, 1fr); gap: 6px; align-items: end; }
    .body-font-scale-row { grid-template-columns: minmax(116px, 1fr) 112px 72px; }
    .body-border-picker { min-width: 0; display: grid; grid-template-rows: 12px 26px; gap: 3px; }
    .body-border-label { color: var(--muted); font-size: 10px; line-height: 12px; }
    .body-border-picker .border-buttons { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .body-border-picker .border-option { min-height: 26px; }
    .body-border-picker .border-option canvas { width: 16px; height: 16px; image-rendering: pixelated; }
    .text-toolbar select { min-width: 0; }
    .font-picker-native { display: none; }
    .font-picker { position: relative; min-width: 0; }
    .font-picker-trigger { width: 100%; min-height: 31px; display: grid; grid-template-columns: minmax(0, 1fr) 14px; align-items: center; gap: 7px; text-align: left; }
    .font-picker-trigger span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .font-picker-trigger svg { width: 14px; height: 14px; color: var(--muted); }
    .font-picker-menu { position: absolute; z-index: 20; top: calc(100% + 3px); left: 0; width: min(280px, calc(100vw - 48px)); max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); box-shadow: 0 8px 20px #0008; }
    .font-picker-group { padding: 4px 0; border-top: 1px solid var(--line); }
    .font-picker-group:first-child { border-top: 0; }
    .font-picker-label { display: block; padding: 4px 8px 3px; color: var(--muted); font-size: 9px; letter-spacing: .04em; }
    .font-picker-row { display: grid; grid-template-columns: minmax(0, 1fr) 28px; align-items: center; }
    .font-picker-choice, .font-favorite { min-width: 0; min-height: 28px; border: 0; border-radius: 0; background: transparent; text-align: left; }
    .font-picker-choice { padding: 4px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .font-picker-choice:hover, .font-picker-choice[aria-selected="true"], .font-favorite:hover { background: #102031; }
    .font-favorite { display: grid; place-items: center; padding: 0; color: var(--muted); }
    .font-favorite svg { width: 14px; height: 14px; }
    .font-favorite[aria-pressed="true"] { background: transparent; color: var(--accent); }
    .font-favorite[aria-pressed="true"]:hover { background: #102031; }
    .font-favorite.is-favorite { color: var(--accent); }
    .font-favorite.is-favorite svg { fill: currentColor; }
    .scroll-field { display: grid; grid-template-columns: 48px minmax(0, 1fr); align-items: center; gap: 7px; }
    .scroll-mode { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
    .scroll-mode button { min-height: 26px; padding: 0 4px; border: 0; border-right: 1px solid var(--line); border-radius: 0; background: var(--panel); color: var(--muted); font-size: 9px; }
    .scroll-mode button:last-child { border-right: 0; }
    .scroll-mode button:hover { background: #102031; border-color: var(--line); }
    .scroll-mode button[aria-pressed="true"] { background: #003948; color: var(--ink); }
    .scale-picker { min-width: 0; display: flex; align-items: center; }
    .scale-toggle { width: 112px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
    .scale-toggle button { min-height: 26px; padding: 0; border: 0; border-right: 1px solid var(--line); border-radius: 0; background: var(--panel); color: var(--muted); font-size: 9px; }
    .scale-toggle button:last-child { border-right: 0; }
    .scale-toggle button:hover { background: #102031; border-color: var(--line); }
    .scale-toggle button[aria-pressed="true"] { background: #003948; color: var(--ink); }
    .format-toggle { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
    .format-toggle button { min-height: 30px; padding: 0 8px; border: 0; border-right: 1px solid var(--line); border-radius: 0; background: var(--panel); color: var(--muted); font-size: 10px; }
    .format-toggle button:last-child { border-right: 0; }
    .format-toggle button:hover { background: #102031; border-color: var(--line); }
    .format-toggle button[aria-pressed="true"] { background: #003948; color: var(--ink); }
    .control-toolbar { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 3px; }
    .toolbar-label { min-height: 30px; display: grid; place-items: center; color: var(--muted); }
    .toolbar-label svg { width: 14px; height: 14px; }
    .toolbar-toggles, .character-buttons, .animation-buttons { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
    .border-buttons { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; }
    .toolbar-toggle, .character-slot, .animation-slot, .border-option { min-width: 0; min-height: 30px; padding: 0; color: var(--muted); font-size: 10px; }
    .toolbar-toggle[aria-pressed="true"] { color: var(--ink); }
    .toolbar-toggle svg, .character-slot svg, .animation-slot svg, .border-option svg { width: 14px; height: 14px; display: block; margin: auto; }
    .body-field { display: grid; gap: 7px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .toggle-field { grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
    .toggle-field label { color: var(--muted); }
    .toggle-field input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
    .theme-row { display: grid; grid-template-columns: minmax(0, 1fr) 74px; gap: 7px; align-items: end; }
    .image-url-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: end; }
    .image-url-row button { min-height: 31px; padding: 0 10px; }
    .palette-preview { min-height: 31px; padding: 4px; display: grid; grid-template-columns: repeat(6, 9px); gap: 2px; align-items: center; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }
    .palette-swatch { width: 9px; height: 17px; border: 1px solid #ffffff33; }
    .source-field { display: none; }
    .rich-editor { width: 100%; min-height: 92px; padding: 7px 8px; overflow-wrap: anywhere; white-space: pre-wrap; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); color: var(--ink); font: inherit; line-height: 1.45; }
    .inline-rich-editor { min-height: 32px; padding: 7px 8px; overflow: hidden; white-space: pre; }
    .cta-rich-editor { min-height: 46px; overflow-wrap: anywhere; white-space: pre-wrap; }
    .field-heading > .rich-editor { flex: 1 1 auto; min-width: 0; }
    .rich-editor:focus { outline: 1px solid var(--accent); outline-offset: 1px; }
    .editor-glyph { display: inline-flex; width: 1em; height: 1em; margin: 0; align-items: center; justify-content: center; color: inherit; font: inherit; vertical-align: -.15em; }
    .editor-glyph img { width: 1em; height: 1em; image-rendering: pixelated; user-select: none; }
    .editor-leader-tab { display: inline-block; margin: 0 2px; padding: 0 2px; color: var(--accent); background: #00ddff1a; font: inherit; }
    .editor-effect-shadow { padding: 0 1px; background: #00ddff1a; box-shadow: 1px 1px 0 #000; }
    .editor-effect-highlight { color: #ffdf4d; }
    .editor-effect-underline { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
    .editor-effect-superscript { position: relative; top: -.4em; font-size: 50%; }
    .editor-effect-subscript { font-size: 50%; }
    .editor-effect-stroke { text-shadow: -1px -1px 0 #000, 0 -1px 0 #000, 1px -1px 0 #000, -1px 0 0 #000, 1px 0 0 #000, -1px 1px 0 #000, 0 1px 0 #000, 1px 1px 0 #000; }
    @keyframes editor-blink { 50% { visibility: hidden; } }
    @keyframes editor-flash { 50% { color: #ffdf4d; } }
    @keyframes editor-reflect { 50% { filter: brightness(1.35); } }
    @keyframes editor-wave { 50% { transform: translateY(-.35em); } }
    @keyframes editor-sweep { 50% { color: #ffdf4d; } }
    @keyframes editor-spin { 0%, 2% { transform: scaleX(1); } 5% { transform: scaleX(.14); } 8% { transform: scaleX(-1); } 11% { transform: scaleX(.14); } 14%, 100% { transform: scaleX(1); } }
    .editor-effect-blink { animation: editor-blink 1s steps(1, end) infinite; }
    .editor-effect-flash { animation: editor-flash .5s steps(1, end) infinite; }
    .editor-effect-reflect { animation: editor-reflect .75s steps(1, end) infinite; }
    .editor-effect-wave { display: inline-block; animation: editor-wave .5s steps(2, end) infinite; }
    .editor-effect-sweep { animation: editor-sweep 1s steps(1, end) infinite; }
    .editor-effect-spin { display: inline-block; transform-origin: center; animation: editor-spin 6.4s steps(4, end) infinite; }
    button { min-height: 32px; border: 1px solid #3d5974; border-radius: 3px; background: #102031; color: var(--ink); cursor: pointer; font: inherit; }
    button:hover { background: #17304a; border-color: var(--accent); } button.primary, button[aria-pressed="true"] { border-color: var(--accent); background: #003948; }
    @keyframes image-clear-confirm { 50% { background: #5b430d; border-color: #ffdf4d; color: #ffdf4d; } }
    #imageClear.is-confirming { border-color: #ffdf4d; color: #ffdf4d; animation: image-clear-confirm .28s steps(2, end) 2; }
    button:disabled { cursor: not-allowed; opacity: .35; } button:disabled:hover { border-color: #3d5974; background: #102031; }
    .glyph-groups { display: grid; gap: 8px; }
    .glyph-system { display: grid; gap: 4px; }
    .glyph-system-title { color: var(--muted); font-size: 10px; }
    .glyph-grid { display: grid; grid-template-columns: repeat(auto-fill, 24px); gap: 3px; }
    .glyph-tile { min-height: 24px; width: 24px; padding: 0; display: grid; place-items: center; background: var(--panel); }
    .glyph-tile:hover, .glyph-tile:focus-visible, .glyph-tile.is-selected { border-color: var(--accent); background: #102031; }
    .glyph-tile canvas { width: 16px; height: 16px; image-rendering: pixelated; }
    .hint { margin: 0; color: var(--muted); font-size: 11px; }
    @media (max-width: 1360px) { .app { padding: 16px; grid-template-columns: 1fr; gap: 22px; align-items: start; } .preview { min-height: 0; padding: 0; order: 1; } .dock { height: auto; padding: 20px 0 0; overflow: visible; border-left: 0; border-right: 0; border-top: 1px solid var(--line); } .left-dock { order: 2; } .right-dock { order: 3; } }
    @media (max-width: 600px) {
      .app { padding: min(836px, calc(125vw + 121px)) 16px 16px; }
      .preview { position: fixed; z-index: 10; top: 0; left: 0; right: 0; padding: 12px 16px; background: #05080d; }
      .preview-header, #preview { width: min(540px, 100%, calc(80dvh - 112px)); }
      .preview[data-output-format="landscape"] .preview-header, .preview[data-output-format="landscape"] #preview { width: min(720px, 100%, calc(177.778dvh - 248px)); }
      .app:has(.preview[data-output-format="landscape"]) { padding-top: min(465px, calc(56.25vw + 143px)); }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="dock left-dock" aria-label="Primary promotion controls">
      <div><h1><canvas id="composerTitle" class="composer-title" width="254" height="32" role="img" aria-label="GK Promo Composer">GK Promo Composer</canvas></h1></div>
      <details class="control-section" open>
        <summary>FILE</summary>
        <div class="section-body">
          <div class="actions"><button id="projectSave" type="button">SAVE PROJECT</button><button id="projectLoad" type="button">LOAD PROJECT</button><button id="png" class="primary" type="button">EXPORT PNG</button><button id="record" type="button">EXPORT 15 SEC MP4</button></div>
          <input id="projectFile" type="file" accept=".gkp,application/json" hidden>
        </div>
      </details>
      <details class="control-section">
        <summary>BASIC SETTINGS</summary>
        <div class="section-body">
          <fieldset><label for="template">TEMPLATE</label><select id="template"></select></fieldset>
          <fieldset><legend>OUTPUT FORMAT</legend><div id="outputFormat" class="format-toggle" role="group" aria-label="Output format"><button type="button" data-output-format="portrait" aria-pressed="true">1080 x 1350</button><button type="button" data-output-format="landscape" aria-pressed="false">1920 x 1080</button></div></fieldset>
          <div class="theme-row">
            <fieldset><label for="theme">COLOR THEME</label><select id="theme"><option value="yuNo" selected>CRT Sunset</option><option value="neon">Neon Space</option><option value="pulse">Signal Pulse</option><option value="solar">Solar Flare</option><option value="emerald">Emerald Terminal</option><option value="cobalt">Cobalt Gold</option><option value="amethyst">Amethyst Night</option><option value="copper">Copper Circuit</option><option value="polar">Polar Signal</option><option value="ruby">Ruby Relay</option></select></fieldset>
            <div id="themePreview" class="palette-preview" role="img" aria-label="Current color theme preview"></div>
          </div>
          <fieldset><label for="gameStyle">BACKGROUND STYLE</label><select id="gameStyle"><option value="asteroids" selected>Asteroids</option><option value="moon-patrol">Moon Patrol</option><option value="starfield">Starfield</option><option value="model">3D Model</option></select></fieldset>
          <fieldset id="modelField" hidden><label for="model">MODEL</label><select id="model"></select><label class="range-label" for="modelEdgeAngle">EDGE ANGLE <output id="modelEdgeAngleOutput">1 deg</output></label><input id="modelEdgeAngle" type="range" min="1" max="45" step="1" value="1"><label class="range-label" for="modelDetail">MESH DETAIL <output id="modelDetailOutput">500 vertices</output></label><input id="modelDetail" type="range" min="100" max="1200" step="10" value="500"><label class="range-label" for="modelOpacity">MODEL OPACITY <output id="modelOpacityOutput">48%</output></label><input id="modelOpacity" type="range" min="0" max="100" step="1" value="48"></fieldset>
          <fieldset class="toggle-field"><label for="boundaries">SHOW TEXT BOUNDARIES</label><input id="boundaries" type="checkbox"></fieldset>
        </div>
      </details>
      <details class="control-section">
        <summary>CRT EMULATION</summary>
        <div class="section-body">
          <fieldset><label for="crtLook">CRT PRESET</label><select id="crtLook"><option value="custom" selected>Custom</option><option value="arcade">Arcade Cabinet</option><option value="broadcast">Broadcast Monitor</option><option value="tube">Warm Tube</option><option value="chroma">Chroma Shift</option></select></fieldset>
          <fieldset><label for="crt">MODE</label><select id="crt"><option value="off" selected>Off</option><option value="soft">CRT-Pi Soft</option><option value="strong">CRT-Pi Strong</option></select></fieldset>
          <fieldset><label class="range-label" for="crtCurve">CURVATURE <output data-crt-output="curve">100%</output></label><input id="crtCurve" type="range" min="0" max="150" step="1" value="100"></fieldset>
          <fieldset><label class="range-label" for="crtRgb">RGB SEPARATION <output data-crt-output="rgb">45%</output></label><input id="crtRgb" type="range" min="0" max="100" step="1" value="45"></fieldset>
          <fieldset><label class="range-label" for="crtScanline">SCANLINE DEPTH <output data-crt-output="scanline">100%</output></label><input id="crtScanline" type="range" min="0" max="100" step="1" value="100"></fieldset>
          <fieldset><label class="range-label" for="crtMask">APERTURE MASK <output data-crt-output="mask">45%</output></label><input id="crtMask" type="range" min="0" max="100" step="1" value="45"></fieldset>
          <fieldset><label class="range-label" for="crtVignette">VIGNETTE <output data-crt-output="vignette">100%</output></label><input id="crtVignette" type="range" min="0" max="200" step="1" value="100"></fieldset>
          <fieldset><label class="range-label" for="crtDrift">SIGNAL DRIFT <output data-crt-output="drift">0%</output></label><input id="crtDrift" type="range" min="0" max="100" step="1" value="0"></fieldset>
          <fieldset><label class="range-label" for="crtBloom">BLOOM <output data-crt-output="bloom">100%</output></label><input id="crtBloom" type="range" min="0" max="150" step="1" value="100"></fieldset>
          <fieldset><label class="range-label" for="crtGlow">PHOSPHOR GLOW <output data-crt-output="glow">100%</output></label><input id="crtGlow" type="range" min="0" max="200" step="1" value="100"></fieldset>
        </div>
      </details>
    </aside>
    <section class="preview" data-output-format="portrait" aria-label="Animated promotion preview">
      <div class="preview-header"><strong>LIVE COMPOSITION</strong><span id="outputResolution">1080 x 1350 / 4:5</span></div>
      <canvas id="preview" width="540" height="675" aria-label="Animated promotion preview"></canvas>
      <output id="status" class="status" aria-live="polite">Loading renderer...</output>
      <output id="overflowStatus" class="status status-warning" aria-live="polite"></output>
      <small class="build-version">BUILD V256</small>
    </section>
    <aside class="dock right-dock" aria-label="Text and artwork controls">
      <details class="control-section sortable-section" data-composite-section="logo">
        <summary draggable="true"><span class="section-grip" aria-hidden="true"><i data-lucide="grip-vertical"></i></span><span>LOGO</span></summary>
        <div class="section-body">
          <input id="logo" type="hidden" value="pixel">
          <fieldset class="toggle-field"><label for="classic">CLASSIC ARCADE</label><input id="classic" type="checkbox" checked></fieldset>
        </div>
      </details>
      <details class="control-section sortable-section" data-composite-section="image">
        <summary draggable="true"><span class="section-grip" aria-hidden="true"><i data-lucide="grip-vertical"></i></span><span>IMAGE</span></summary>
        <div class="section-body">
          <fieldset><label for="imageFile">SOURCE IMAGE</label><input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/x-icon,image/avif"></fieldset>

  <script type="module">
    const modules = [
      ['CRT', './promo/crt.js?v=256'],
      ['fonts', './promo/fonts.js?v=256'],
      ['output formats', './promo/formats.js?v=256'],
      ['game backgrounds', './promo/game-backgrounds.js?v=256'],
      ['image block', './promo/image-block.js?v=256'],
      ['renderer', './promo/renderer.js?v=256'],
      ['rich text editor', './promo/rich-text-editor.js?v=256'],
      ['templates', './promo/templates.js?v=256'],
    ];
    (async () => {
      for (const [name, source] of modules) {
        try {
          await import(source);
        } catch (error) {
          throw new Error(`${name} module: ${error.message}`, { cause: error });
        }
      }
      await import('./promo/app.js?v=256');
    })().catch(error => {
      document.querySelector('#status').textContent = `Could not load composer: ${error.message}`;
      console.error('Promo Composer startup failed:', error, error.cause || '');
    });
  </script>
